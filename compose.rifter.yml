services:
  db:
    image: postgres:18.6
    container_name: rifter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openrift
      POSTGRES_USER: openrift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrift -d openrift"]
      interval: 3s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.30.0
    container_name: rifter-mail
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
    name: rifter-postgres
    external: true
